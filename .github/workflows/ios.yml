name: iOS build
# Builds an unsigned IPA on a GitHub-hosted Mac (spec: .kiro/specs/ios-app).
# Install it with Sideloadly and a free Apple ID; see README "iOS".
on:
  push:
    branches: [main, ios-app]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate localised strings from Android strings.xml
        shell: pwsh
        run: ./scripts/gen-ios-strings.ps1

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          set -o pipefail
          if ! xcodegen generate 2>&1 | tee xcodegen.log; then
            while IFS= read -r line; do echo "::error title=xcodegen::$line"; done < xcodegen.log
            exit 1
          fi

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project KeepGoing.xcodeproj \
            -scheme KeepGoing \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions

      - name: Report build errors
        if: failure()
        working-directory: ios
        run: |
          # Plain annotations as well, in case the formatter missed project-level errors.
          if [ -f xcodebuild.log ]; then
            grep -E "error:|fatal error" xcodebuild.log | sort -u | head -n 10 | while IFS= read -r line; do
              echo "::error title=xcodebuild::$line"
            done
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/KeepGoing.app Payload/
          zip -qry keep-going-elliptical-unsigned.ipa Payload
          ls -l keep-going-elliptical-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: keep-going-elliptical-ipa
          path: keep-going-elliptical-unsigned.ipa

      # Pushing a tag like v1.1.0 attaches the IPA to the GitHub Release next to the APK.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: keep-going-elliptical-unsigned.ipa
